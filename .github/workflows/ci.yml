name: Test and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full_windows_desktop:
        description: Force clean Windows 10 and 11 installation checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-policy:
    name: Decide Windows desktop coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      required: ${{ steps.policy.outputs.required }}
      baseline: ${{ steps.policy.outputs.baseline }}
      reason: ${{ steps.policy.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare with the last successful canonical main CI
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_WINDOWS_DESKTOP: ${{ github.event_name == 'workflow_dispatch' && inputs.full_windows_desktop || false }}
        run: |
          if [[ "$FORCE_WINDOWS_DESKTOP" == "true" ]]; then
            python3 -I scripts/ci_windows_policy.py --head "$GITHUB_SHA" --force
          else
            python3 -I scripts/ci_windows_policy.py --head "$GITHUB_SHA"
          fi

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.15'
          enable-cache: false
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: uv sync --locked --python '${{ matrix.python }}'
      - name: Unit, concurrency, registration, and packaging checks
        run: uv run --frozen pytest
      - name: Source inventory and accidental credential scan
        run: uv run --frozen python -I scripts/release.py audit

  release-artifacts:
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.15'
          enable-cache: false
          python-version: '3.13'
      - run: uv sync --locked --python 3.13
      - name: Build versioned archive and wheel
        run: |
          uv run --frozen python -I scripts/release.py build --output dist
          uv build --wheel --out-dir dist
      - name: Verify wheel matches reviewed source
        run: uv run --frozen python -I scripts/release.py verify-wheel dist/*.whl
      - name: Verify actual macOS archive installation and update
        run: uv run --frozen python -I scripts/smoke-install-macos.py dist/*.zip
      - name: Verify transition through the unmodified 0.6.1 updater
        run: uv run --frozen python -I scripts/smoke-upgrade-06.py dist/*.zip
      - name: Verify publication files and current release documentation
        run: python3 -I scripts/publish-release.py dist
      - name: Save workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: telegram-mcp-macos
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.manifest.json
            dist/*.whl
          if-no-files-found: error
          retention-days: 30

  windows-install:
    name: Windows Server 2025 installation
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.15'
          enable-cache: false
          python-version: '3.13'
      - name: Install locked native Windows dependencies
        run: uv sync --locked --python 3.13
      - name: Windows security, shared service, and portable core checks
        # The existing macOS registration/service tests deliberately exercise POSIX APIs.
        run: >-
          uv run --frozen pytest
          tests/test_platform_support.py
          tests/test_windows_credentials.py
          tests/test_windows_service.py
          tests/test_windows_install.py
          tests/test_windows_updates.py
          tests/test_windows_update_schedule.py
          tests/test_update_feed.py
          tests/test_tool_catalog_parity.py
          tests/test_windows_native_runtime.py
          tests/test_runtime_storage.py
          tests/test_editing.py
          tests/test_editing_integration.py
          tests/test_outgoing_attachments.py
          tests/test_outgoing_native.py
          tests/test_public_posts.py
          tests/test_public_posts_safety.py
          tests/test_public_search_consent.py
          tests/test_navigation.py
          tests/test_read_navigation_regressions.py
          tests/test_context_regressions.py
          tests/test_read_error_regressions.py
          tests/test_read_service_regressions.py
          tests/test_server.py
          tests/test_speech.py
          tests/test_tdjson.py
          tests/test_cli.py
          tests/test_codex_config.py
          tests/test_native_runtime.py::test_pinned_native_library_version_and_recognition_parser
          tests/test_native_runtime.py::test_runtime_rejects_library_outside_pinned_build
      - name: Build and audit the source archive
        run: |
          uv run --frozen python -I scripts/release.py audit
          uv run --frozen python -I scripts/release.py build --output dist
      - name: Inspect native scheduler XML normalization with an inert temporary task
        run: uv run --frozen python -I scripts/probe-windows-update-schedule.py
      - name: Verify actual Windows archive installation and plugin discovery
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one source release archive' }
          $archive = $archives[0].FullName
          uv run --frozen python -I scripts/smoke-install-windows.py $archive --report-path dist/windows-server-acceptance.json
      - name: Save Windows Server acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-server-acceptance
          path: dist/windows-server-acceptance.json
          if-no-files-found: warn
          retention-days: 30

  windows-desktop:
    needs: desktop-policy
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      needs.desktop-policy.outputs.required == 'true'
    uses: ./.github/workflows/windows-desktop.yml

  release-ready:
    name: Validate release prerequisites
    needs: [desktop-policy, tests, release-artifacts, windows-install, windows-desktop]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require successful checks and an explicit desktop policy decision
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -I scripts/ci_release_gate.py

  publish-release:
    needs: release-ready
    if: >-
      always() && !cancelled() && needs.release-ready.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'prabchevski/telegram-mcp'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: telegram-mcp-macos
          path: dist
      - name: Publish a new version with verified assets; retain existing releases
        run: python3 -I scripts/publish-release.py dist --publish
        env:
          GH_TOKEN: ${{ github.token }}
